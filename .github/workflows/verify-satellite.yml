# Runs the engine's satellite contract verification on every pull request
# (docs/satellite-verification.md in artisanpack-ui/ecommerce). On tags the
# release workflow runs it instead, signs the report, and attaches it to the
# release.
#
# All four gateways (paypal, paypal-card, paypal-apple-pay,
# paypal-google-pay) must pass the engine's PaymentGatewayContractTest
# (tests/Feature/Contracts); testbench.yaml enables PayPal with placeholder
# credentials so discovery finds them.
name: Verify satellite

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Pinned to an engine release tag: never point this at a moving branch.
    uses: ArtisanPack-UI/ecommerce/.github/workflows/verify-satellite.yml@v1.3.0
    permissions:
      contents: read
    with:
      php-version: '8.4'
